<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMOT</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="loading" class="loading">캐릭터 불러오는 중…</div>

  <section class="panel stats">
    <h1>EMOT</h1>
    <div class="row"><span>코인</span><b id="money">0</b></div>
    <div class="row"><span>레벨</span><b id="level">1</b></div>
    <div class="bar"><i id="level-bar"></i></div>
    <div class="row"><span>허기</span><b id="hunger">0</b></div>
    <div class="bar"><i id="hunger-bar" class="warm"></i></div>
    <div class="row"><span>피로</span><b id="fatigue">0</b></div>
    <div class="bar"><i id="fatigue-bar" class="cool"></i></div>
    <div class="row"><span>행동</span><b id="action">-</b></div>
    <p class="hint">가구를 클릭하면 지시할 수 있어요</p>
  </section>
  <script type="module" src="src/main.js"></script>
</body>
</html>
